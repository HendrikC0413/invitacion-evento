<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* 
       * ESPACIO PARA BACKGROUND: Reemplaza la URL de abajo con la de tu imagen.
       * 'cover' y 'fixed' aseguran que se amolde y se vea perfecto tanto en web como en móvil. 
       */
      background: url('https://image.tmdb.org/t/p/original/xg27NrXi7VXCGUr7MG75UqLl6Vg.jpg') no-repeat center center fixed;
      background-size: cover; 
      background-color: #f4f4f9; /* Color de respaldo si la imagen falla */
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      /* Fondo blanco semitransparente para que el texto sea legible sobre cualquier imagen */
      background: rgba(255, 255, 255, 0.95); 
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    /* Tamaños de fuente aumentados un ~20% para mejor legibilidad en móviles */
    h1 { color: #2c3e50; font-size: 29px; margin-bottom: 10px; }
    p { font-size: 19px; color: #555; line-height: 1.5; }
    
    .form-group {
      margin: 25px 0;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 19px;
      font-weight: 500;
    }
    /* Estilos del campo de texto requerido */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 19px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box; /* Previene que el padding desborde el ancho en móviles */
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 6px;
      font-size: 19px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
      font-weight: bold;
    }
    button:hover { background-color: #219150; }
    button:disabled { background-color: #95a5a6; cursor: not-allowed; }
    #mensaje-respuesta { margin-top: 20px; font-size: 19px; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Estás Invitad@!</h1>
    <p>Nos encantaría contar con tu presencia UNA FIESTA DE CUMPLEAÑOS LLENAS DE EMOCIONES!!</p>
    
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

    <form id="rsvp-form">
      <div class="form-group">
        <label for="nombre-invitado">¿Quién confirma su asistencia?</label>
        <!-- Atributo 'required' para forzar el llenado antes de enviar -->
        <input type="text" id="nombre-invitado" placeholder="Ingresa tu nombre y apellido" required>
      </div>

      <button type="submit" id="btn-submit">Confirmar Asistencia</button>
    </form>

    <div id="mensaje-respuesta"></div>
  </div>

  <script>
    // URL de Google Apps Script
    const URL_DE_TU_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzYIzoTr_qark-S_CegwiroLlKqZWRAEhtAVtU4IDnE3rrqdkRoHGQIaNtC9qiFYVWi/exec";

    const form = document.getElementById('rsvp-form');
    const inputNombre = document.getElementById('nombre-invitado');
    const mensajeRespuesta = document.getElementById('mensaje-respuesta');
    const btnSubmit = document.getElementById('btn-submit');

    // Desacoplando la lógica de envío mediante Async/Await para un Clean Code
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const nombre = inputNombre.value.trim();
      
      // Control de estado de la interfaz
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Confirmando...";

      // Payload simplificado: al presionar el botón se asume directamente la asistencia
      const datos = {
        nombre: nombre,
        asistencia: "Confirmado"
      };

      try {
        await fetch(URL_DE_TU_APPS_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        // Respuesta exitosa (Renderización)
        form.style.display = 'none';
        mensajeRespuesta.textContent = "¡Muchas gracias! Tu asistencia ha sido confirmada.";
      } catch (error) {
        // Manejo de errores
        console.error('Error en la petición fetch:', error);
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Confirmar Asistencia";
        alert("Hubo un error de conexión al enviar tu respuesta. Por favor intenta de nuevo.");
      }
    });
  </script>
</body>
</html>
